<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    <!-- Header -->
    <div class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Diabetes Prediction System</h1>
                    <p class="text-gray-600 text-sm mt-1">AI-powered diabetes risk assessment tool</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid lg:grid-cols-2 gap-8">
            <!-- Form Section -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center gap-2 mb-6">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                    </svg>
                    <h2 class="text-2xl font-bold text-gray-800">Patient Information</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Number of Pregnancies</label>
                        <input type="number" id="pregnancies" placeholder="e.g., 2" min="0" max="17" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Glucose Level (mg/dL)</label>
                        <input type="number" id="glucose" placeholder="e.g., 120" min="0" max="199" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Blood Pressure (mm Hg)</label>
                        <input type="number" id="bloodPressure" placeholder="e.g., 70" min="0" max="122" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Skin Thickness (mm)</label>
                        <input type="number" id="skinThickness" placeholder="e.g., 20" min="0" max="99" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Insulin Level (mu U/ml)</label>
                        <input type="number" id="insulin" placeholder="e.g., 80" min="0" max="846" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Body Mass Index (BMI)</label>
                        <input type="number" id="bmi" placeholder="e.g., 25.5" min="0" max="67" step="0.1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Diabetes Pedigree Function</label>
                        <input type="number" id="diabetesPedigreeFunction" placeholder="e.g., 0.5" min="0.07" max="2.42" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Age (years)</label>
                        <input type="number" id="age" placeholder="e.g., 35" min="21" max="81" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>

                    <div class="flex gap-4 pt-4">
                        <button onclick="predictRisk()" id="predictBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md flex items-center justify-center">
                            Predict Risk
                        </button>
                        <button onclick="resetForm()" class="px-6 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                            Reset
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="space-y-6">
                <div id="defaultState" class="bg-white rounded-xl shadow-lg p-8 text-center">
                    <h3 class="text-xl font-semibold text-gray-700 mb-2">Awaiting Input</h3>
                    <p class="text-gray-500">Please fill in the patient information form to get a diabetes risk prediction.</p>
                </div>

                <div id="predictionResult" class="hidden">
                    <div id="resultCard" class="rounded-xl shadow-lg p-6 fade-in">
                        <div class="flex items-center gap-3 mb-4">
                            <h3 class="text-2xl font-bold text-gray-900">Prediction Result</h3>
                        </div>
                        <div class="space-y-4">
                            <div id="resultText" class="text-xl font-semibold"></div>
                            <div class="bg-white rounded-lg p-4 shadow">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-gray-700 font-medium">Risk Probability:</span>
                                    <span id="probabilityText" class="text-2xl font-bold text-blue-600"></span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-3">
                                    <div id="progressBar" class="h-3 rounded-full transition-all"></div>
                                </div>
                            </div>
                            <div class="bg-white rounded-lg p-4 shadow">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium text-gray-700">Risk Level:</span>
                                    <span id="riskLevel" class="font-bold"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fieldInfo = {
            pregnancies: { min: 0, max: 17 },
            glucose: { min: 0, max: 199 },
            bloodPressure: { min: 0, max: 122 },
            skinThickness: { min: 0, max: 99 },
            insulin: { min: 0, max: 846 },
            bmi: { min: 0, max: 67 },
            diabetesPedigreeFunction: { min: 0.07, max: 2.42 },
            age: { min: 21, max: 81 }
        };

        function validateForm() {
            let isValid = true;
            Object.keys(fieldInfo).forEach(key => {
                const input = document.getElementById(key);
                if (input.value === '') {
                    input.classList.add('border-red-500');
                    isValid = false;
                } else {
                    input.classList.remove('border-red-500');
                }
            });
            if (!isValid) {
                alert("Please fill in all patient fields.");
            }
            return isValid;
        }

        function preprocessData() {
            const data = {};
            Object.keys(fieldInfo).forEach(key => {
                data[key] = parseFloat(document.getElementById(key).value);
            });
            return data;
        }

        async function predictRisk() {
            if (!validateForm()) return;
            const data = preprocessData();
            const btn = document.getElementById('predictBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg> Processing...`;
            btn.disabled = true;

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok || result.error) {
                    alert("Error: " + (result.error || "Prediction request failed"));
                    return;
                }

                const hasDiabetes = result.prediction === 1;
                const probability = result.probability;
                const riskLevel = probability >= 70 ? "High" : probability >= 40 ? "Moderate" : "Low";

                displayResult({ hasDiabetes, probability, riskLevel });
            } catch (err) {
                alert("Network error: " + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function displayResult(result) {
            document.getElementById('defaultState').classList.add('hidden');
            document.getElementById('predictionResult').classList.remove('hidden');

            const resultText = document.getElementById('resultText');
            const probabilityText = document.getElementById('probabilityText');
            const progressBar = document.getElementById('progressBar');
            const riskLevel = document.getElementById('riskLevel');

            if (result.hasDiabetes) {
                resultText.textContent = "⚠️ High Risk of Diabetes Detected";
                resultText.className = "text-xl font-semibold text-red-700";
            } else {
                resultText.textContent = "✅ Low Risk of Diabetes";
                resultText.className = "text-xl font-semibold text-green-700";
            }

            probabilityText.textContent = result.probability + "%";
            progressBar.style.width = Math.min(100, Math.max(0, result.probability)) + "%";

            if (result.probability >= 70) {
                progressBar.className = "h-3 rounded-full bg-red-500 transition-all";
                riskLevel.className = "font-bold text-red-600";
            } else if (result.probability >= 40) {
                progressBar.className = "h-3 rounded-full bg-yellow-500 transition-all";
                riskLevel.className = "font-bold text-yellow-600";
            } else {
                progressBar.className = "h-3 rounded-full bg-green-500 transition-all";
                riskLevel.className = "font-bold text-green-600";
            }

            riskLevel.textContent = result.riskLevel;
        }

        function resetForm() {
            Object.keys(fieldInfo).forEach(key => {
                const el = document.getElementById(key);
                el.value = '';
                el.classList.remove('border-red-500');
            });
            document.getElementById('defaultState').classList.remove('hidden');
            document.getElementById('predictionResult').classList.add('hidden');
        }
    </script>
</body>
</html>
